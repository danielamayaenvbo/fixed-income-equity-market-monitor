[project]
name = "market-monitor-backend"
version = "0.1.0"
description = "Backend for the Fixed Income & Equity Market Monitor"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "pandas-market-calendars>=4.4,<6",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "tenacity>=9,<10",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=14,<16",
    "yfinance>=0.2.50,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
